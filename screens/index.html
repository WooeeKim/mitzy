<!doctype html>
<!-- 믿쥐 웹 프로토타입 — Figma 03 Screens를 옮긴 화면들을 이어서 눌러볼 수 있어요.
     데이터는 data/*.json, 문구는 i18n/*.json, 색·간격·글꼴은 design-tokens/tokens.css에서 읽어요.
     주소: /screens/index.html#/welcome  (?lang=en · ?theme=dark) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>믿쥐 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="tools" aria-label="미리보기 설정">

  <div class="row">
    <button id="lang" type="button"></button>
    <button id="theme" type="button"></button>

<script src="core.js"></script>
<script src="screens.js"></script>

</html>
